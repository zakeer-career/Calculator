name: Build Android APK & Auto Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Extract App Version & Metadata
        id: app_info
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi
          
          # If triggered by a git tag, use the tag directly; otherwise create an iteration tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            IS_PRERELEASE="false"
          else
            RELEASE_TAG="v${VERSION}-build.${{ github.run_number }}"
            IS_PRERELEASE="true"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (Tag: ${RELEASE_TAG}, Prerelease: ${IS_PRERELEASE})"

      - name: Set up JDK 21 (Latest LTS)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          chmod +x gradlew

      - name: Configure CI Environment & Dummy Services
        run: |
          # Create dummy .env for Secrets Gradle Plugin if missing
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_ci_builds" > .env
          fi
          if [ ! -f app/.env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_ci_builds" > app/.env
          fi
          
          # Create dummy google-services.json for Google Services Plugin if missing
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "app-ci-dummy",
              "storage_bucket": "app-ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.zakeercareer.calculator"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyForCI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Android Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8 -Djava.awt.headless=true' -Djava.awt.headless=true"
        run: |
          ./gradlew :app:assembleDebug \
            --build-cache \
            --parallel \
            --configuration-cache \
            -Dorg.gradle.vfs.watch=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -x test \
            -x lint \
            --stacktrace

      - name: Prepare Named APK Artifact
        id: prepare_apk
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          ORIGINAL_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -n "$ORIGINAL_APK" ]; then
            RELEASE_APK="${APK_DIR}/Calculator-${{ steps.app_info.outputs.RELEASE_TAG }}.apk"
            cp "$ORIGINAL_APK" "$RELEASE_APK"
            echo "APK_PATH=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
            echo "Prepared release APK at: ${RELEASE_APK}"
          else
            echo "Error: No APK found in $APK_DIR" >&2
            exit 1
          fi

      - name: Package Source Code Archive
        id: prepare_source
        run: |
          SOURCE_ZIP="Calculator-${{ steps.app_info.outputs.RELEASE_TAG }}-source.zip"
          echo "Packaging source code into ${SOURCE_ZIP}..."
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            # Create clean git archive from HEAD
            git archive --format=zip --prefix="Calculator-${{ steps.app_info.outputs.VERSION }}/" --output="$SOURCE_ZIP" HEAD
          else
            # Fallback zip excluding generated build artifacts
            zip -r "$SOURCE_ZIP" . -x "*.git*" -x "*build/*" -x "*.gradle/*" -x "*node_modules/*" -x "*.env" -x "*debug.keystore*"
          fi
          echo "SOURCE_ZIP=${SOURCE_ZIP}" >> "$GITHUB_OUTPUT"
          echo "Source archive successfully created at: ${SOURCE_ZIP}"

      - name: Generate Checksums
        id: generate_checksums
        run: |
          CHECKSUM_FILE="SHA256SUMS.txt"
          sha256sum "${{ steps.prepare_apk.outputs.APK_PATH }}" "${{ steps.prepare_source.outputs.SOURCE_ZIP }}" | sed "s|${APK_DIR}/||" > "$CHECKSUM_FILE"
          echo "CHECKSUM_FILE=${CHECKSUM_FILE}" >> "$GITHUB_OUTPUT"
          echo "--- Checksums ---"
          cat "$CHECKSUM_FILE"

      - name: Upload Build Artifacts (APK & Source)
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-${{ steps.app_info.outputs.RELEASE_TAG }}-artifacts
          path: |
            ${{ steps.prepare_apk.outputs.APK_PATH }}
            ${{ steps.prepare_source.outputs.SOURCE_ZIP }}
            ${{ steps.generate_checksums.outputs.CHECKSUM_FILE }}
          retention-days: 30
          compression-level: 0

      - name: Generate Release Notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## \[/{count++} count==1{if ($0 ~ /^---/) exit; print}' CHANGELOG.md > RELEASE_NOTES.md
          fi
          
          if [ ! -s RELEASE_NOTES.md ]; then
            cat << EOF > RELEASE_NOTES.md
          ## 📱 Calculator Release ${{ steps.app_info.outputs.RELEASE_TAG }}

          **Commit:** \`${{ github.sha }}\`  
          **Build Number:** #${{ github.run_number }}  
          **Event:** \`${{ github.event_name }}\`  

          ### 📦 Release Assets
          - **Android APK:** \`Calculator-${{ steps.app_info.outputs.RELEASE_TAG }}.apk\`
          - **Source Code Archive:** \`Calculator-${{ steps.app_info.outputs.RELEASE_TAG }}-source.zip\`
          - **Integrity:** \`SHA256SUMS.txt\`

          ### ⬇️ Downloads
          Download the APK to install directly on your Android device, or download the source code zip archive below.
          EOF
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.prepare_apk.outputs.APK_PATH }}
            ${{ steps.prepare_source.outputs.SOURCE_ZIP }}
            ${{ steps.generate_checksums.outputs.CHECKSUM_FILE }}
          tag_name: ${{ steps.app_info.outputs.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Calculator ${{ steps.app_info.outputs.RELEASE_TAG }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.app_info.outputs.IS_PRERELEASE == 'true' }}
          make_latest: ${{ steps.app_info.outputs.IS_PRERELEASE != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android Debug APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# Automatically cancels previous in-progress runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:+UseG1GC' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          validate-wrappers: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6.1

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure dummy configuration files exist
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_ci_builds" > .env
          fi
          if [ ! -f app/.env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_ci_builds" > app/.env
          fi
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"1234567890","project_id":"calz-app-dummy","storage_bucket":"calz-app-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.example.uetlin"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyApiKeyForGitHubActionsBuilds"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-v${{ github.run_number }}
          name: "Alpha Release v${{ github.run_number }} — Zakeer-Butt"
          prerelease: true
          make_latest: true
          body: |
            ## 🚀 Alpha Stage Release

            **Lead Developer / Creator:** Zakeer-Butt  
            **Build Iteration:** #${{ github.run_number }}  
            **Commit:** `${{ github.sha }}`  

            ---

            ### 🌟 Alpha Stage Note
            > *Welcome to the official Alpha preview build! This application is currently in its active **Alpha Stage**, crafted with love by **Zakeer-Butt**.*
            > 
            > *It showcases futuristic theme engines, customizable history bars, high-precision math calculations, and modern Jetpack Compose layouts. Features and APIs are being actively refined.*

            ---

            📦 **Download APK:**
            - Grab `app-debug.apk` below to test on your Android device!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
